<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logo Icon -->
  <g transform="translate(10, 24)">
    <!-- Background Circle -->
    <rect width="32" height="32" rx="6" fill="#2563EB" />
    
    <!-- Central "C" for ClientSync -->
    <g transform="translate(16, 16)">
      <!-- Main C Shape -->
      <path d="M-6,-8 Q-10,-8 -10,-4 L-10,0 L-10,4 Q-10,8 -6,8 L-2,8" 
            stroke="white" 
            stroke-width="3" 
            stroke-linecap="round" 
            fill="none"/>
      
      <!-- Sync Connection Points -->
      <circle cx="-8" cy="-4" r="1.5" fill="#10B981" />
      <circle cx="-8" cy="0" r="1.5" fill="white" />
      <circle cx="-8" cy="4" r="1.5" fill="#10B981" />
      
      <!-- AI Processing Dots -->
      <circle cx="2" cy="-4" r="0.8" fill="white" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <circle cx="2" cy="0" r="0.8" fill="white" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="2" cy="4" r="0.8" fill="white" opacity="0.8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" begin="1s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Sync Flow Lines -->
      <path d="M-6,-4 Q0,-4 2,-4" 
            stroke="#10B981" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            fill="none" 
            opacity="0.7"/>
      <path d="M-6,0 Q0,0 2,0" 
            stroke="white" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            fill="none" 
            opacity="0.8"/>
      <path d="M-6,4 Q0,4 2,4" 
            stroke="#10B981" 
            stroke-width="1.5" 
            stroke-linecap="round" 
            fill="none" 
            opacity="0.7"/>
    </g>
    
    <!-- Corner Accents -->
    <rect x="2" y="2" width="6" height="1" rx="0.5" fill="white" opacity="0.3"/>
    <rect x="2" y="29" width="6" height="1" rx="0.5" fill="white" opacity="0.3"/>
  </g>
  
  <!-- Text Logo -->
  <g transform="translate(58, 0)">
    <!-- ClientSync Text -->
    <text x="0" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#2563EB">
      Client<tspan fill="#10B981">Sync</tspan>
    </text>
    
    <!-- Tagline -->
    <text x="0" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#6B7280">
      AI-Powered Client Support Platform
    </text>
    
    <!-- Sync Indicator -->
    <g transform="translate(0, 18)">
      <circle cx="175" cy="0" r="3" fill="#10B981" opacity="0.8">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
